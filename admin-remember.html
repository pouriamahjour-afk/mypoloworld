<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My Polo World — Admin</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f4ec}
iframe{display:block;width:100%;height:100%;border:0;background:#f7f4ec}
</style>
</head>
<body>
<iframe id="adminFrame" src="admin.html" title="My Polo World Admin"></iframe>

<script>
(() => {
  const STORAGE_KEY = "mypoloworld_admin_token_v1";
  const frame = document.getElementById("adminFrame");

  function installRememberToken() {
    try {
      const doc = frame.contentDocument;
      if (!doc || doc.getElementById("rememberTokenRow")) return;

      const connectPanel = doc.getElementById("connectPanel");
      const tokenInput = doc.getElementById("token");
      const connectBtn = doc.getElementById("connectBtn");
      if (!connectPanel || !tokenInput || !connectBtn) return;

      const grid = connectPanel.querySelector(".row");
      if (!grid) return;

      const row = doc.createElement("div");
      row.id = "rememberTokenRow";
      row.className = "c12";
      row.style.marginTop = "2px";
      row.innerHTML = `
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
          <input id="rememberToken" type="checkbox"
                 style="width:auto;margin:0;transform:scale(1.08)">
          <span style="font-size:13px;font-weight:600;text-transform:none;letter-spacing:0;color:#162019">
            Remember token on this device
          </span>
          <button id="forgetSavedToken" type="button" class="secondary" style="padding:7px 10px">
            Forget saved token
          </button>
        </div>
        <div class="help" style="margin-top:7px">
          Use this only on your own laptop. The token is stored only in this browser
          and is never written to GitHub or site-data.json.
        </div>`;
      grid.appendChild(row);

      const remember = doc.getElementById("rememberToken");
      const forget = doc.getElementById("forgetSavedToken");
      const saved = localStorage.getItem(STORAGE_KEY);

      if (saved) {
        tokenInput.value = saved;
        remember.checked = true;
      }

      connectBtn.addEventListener("click", () => {
        const value = tokenInput.value.trim();
        if (remember.checked && value) {
          localStorage.setItem(STORAGE_KEY, value);
        } else if (!remember.checked) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }, true);

      remember.addEventListener("change", () => {
        if (!remember.checked) localStorage.removeItem(STORAGE_KEY);
      });

      forget.addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEY);
        tokenInput.value = "";
        remember.checked = false;

        const status = doc.getElementById("status");
        if (status) {
          status.className = "status ok";
          status.textContent = "Saved token forgotten from this browser.";
        }
      });
    } catch (e) {
      console.error("Remember-token helper could not load", e);
    }
  }

  frame.addEventListener("load", installRememberToken);
})();
</script>
</body>
</html>
