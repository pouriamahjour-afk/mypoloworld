<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="My Polo World — a curated world of polo lifestyle brands.">
<title>My Polo World</title>
<link rel="canonical" href="https://mypoloworld.com/">
<style>
:root{
  --ink:#142019;
  --paper:#fbfaf6;
  --line:rgba(20,32,25,.14);
  --green:#204d38;
  --navy:#071b33;
  --burgundy:#6f1727;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--paper);font-family:"Helvetica Neue",Arial,sans-serif}
button,summary,a{-webkit-tap-highlight-color:transparent}
.site-header{min-height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:rgba(251,250,246,.96);position:sticky;top:0;z-index:100}
.wordmark{color:inherit;text-decoration:none;font-family:Georgia,"Times New Roman",serif;font-size:1.2rem;letter-spacing:.22em}
.site-nav{display:flex;gap:28px}
.site-nav a{color:inherit;text-decoration:none;text-transform:uppercase;font-size:.78rem;letter-spacing:.16em}
.hero{width:100%;min-height:clamp(300px,47vw,650px);background:#f0ede5 center/cover no-repeat;border-bottom:1px solid var(--line)}
.intro{max-width:760px;margin:auto;padding:74px 24px 46px;text-align:center}
.eyebrow{margin:0 0 18px;font-size:.76rem;letter-spacing:.25em;text-transform:uppercase;color:#6b706d}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,4vw,3.4rem);font-weight:400;letter-spacing:.06em}
.intro p:last-child{max-width:560px;margin:20px auto 0;color:#59605c;font-family:Georgia,"Times New Roman",serif;line-height:1.75}
.brands{width:min(1240px,92vw);margin:auto;padding-bottom:92px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
.brand-card{border:1px solid var(--line);border-bottom:4px solid var(--accent,#204d38);background:#fff;overflow:hidden}
summary{list-style:none}
summary::-webkit-details-marker{display:none}
.brand-summary{cursor:pointer}
.brand-head{min-height:460px;padding:34px 26px 28px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:#f7f4ec}
.brand-card[data-brand="santa"] .brand-head{background:#f3efe5}
.brand-card[data-brand="venezia"] .brand-head{background:#f4eee8}
.logo-wrap{width:100%;height:325px;display:grid;place-items:center}
.brand-logo{max-width:91%;max-height:305px;object-fit:contain;mix-blend-mode:multiply}
.brand-card[data-brand="santa"] .brand-logo{max-width:82%}
.brand-label{width:100%;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}
.brand-label strong{font-family:Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:.06em}
.plus{font-size:1.5rem;transition:.2s}
.brand-card[open]>.brand-summary .plus{transform:rotate(45deg)}
.category{border-top:1px solid var(--line);background:#fff}
.category-title,.subcategory-title{cursor:pointer;display:flex;align-items:center;justify-content:space-between;text-transform:uppercase}
.category-title{min-height:64px;padding:0 24px;font-size:.78rem;letter-spacing:.16em}
.category-title:after,.subcategory-title:after{content:"+";font-size:1.25rem}
.category[open]>.category-title:after,.subcategory[open]>.subcategory-title:after{content:"−"}
.subcategory{background:#faf9f5;border-top:1px solid rgba(20,32,25,.09)}
.subcategory-title{min-height:55px;padding:0 30px;font-size:.73rem;letter-spacing:.13em}
.leaf-list{background:#fff}
.leaf{width:100%;min-height:48px;padding:0 38px;border:0;border-top:1px solid rgba(20,32,25,.07);background:#fff;color:inherit;display:flex;align-items:center;justify-content:space-between;font-family:inherit;font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;text-align:left;cursor:pointer}
.leaf:hover{background:#f5f2ea}
.leaf:after{content:"→";font-size:1rem}
.collection{width:min(1240px,92vw);margin:0 auto 100px;scroll-margin-top:100px}
.collection[hidden]{display:none}
.collection-banner{min-height:clamp(260px,38vw,520px);background:center/cover no-repeat}
.collection-title{text-align:center;padding:55px 24px 45px}
.collection-title p{margin:0 0 12px;text-transform:uppercase;letter-spacing:.22em;font-size:.72rem;color:#777}
.collection-title h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,3vw,2.8rem);font-weight:400}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;align-items:start}
.product{background:#fff;border:1px solid var(--line);overflow:hidden}
.product[open]{grid-column:1/-1}
.product-summary{cursor:pointer}
.product-cover{padding:10px}
.product-cover img{width:100%;aspect-ratio:1/1;display:block;object-fit:contain;background:#fff}
.product-info{padding:19px 20px 20px;border-top:1px solid var(--line)}
.product-top{display:flex;justify-content:space-between;align-items:flex-end;gap:15px}
.product-name{margin:0 0 6px;color:#777;font-size:.68rem;text-transform:uppercase;letter-spacing:.14em}
.product-code{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:1.35rem;font-weight:400}
.product-price{font-family:Georgia,"Times New Roman",serif;font-size:1.2rem;white-space:nowrap}
.view-details{display:block;margin-top:15px;padding-top:13px;border-top:1px solid rgba(20,32,25,.09);font-size:.68rem;letter-spacing:.15em;text-transform:uppercase}
.view-details:after{content:"View details +"}
.product[open] .view-details:after{content:"Close −"}
.product[open] .product-summary{display:grid;grid-template-columns:minmax(280px,1fr) 1fr;align-items:center}
.product[open] .product-cover{padding:24px}
.product[open] .product-info{border-top:0;border-left:1px solid var(--line);padding:35px}
.product:not([open])>.product-details{display:none}
.product[open]>.product-details{border-top:1px solid var(--line);padding:28px;display:grid;grid-template-columns:2fr 1fr;gap:35px}
.detail-gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.detail-gallery img{width:100%;aspect-ratio:1/1;object-fit:contain;border:1px solid rgba(20,32,25,.08);background:#fff}
.detail-copy h4{margin:0 0 22px;font-family:Georgia,"Times New Roman",serif;font-size:1.6rem;font-weight:400}
.detail-row{padding:12px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:.82rem}
.detail-row span:first-child{color:#777;text-transform:uppercase;letter-spacing:.1em;font-size:.7rem}
.product-link{color:inherit;text-underline-offset:3px;word-break:break-all}
.watch-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;align-items:start}
.watch-card{background:#fff;border:2px solid var(--green);padding:12px}
.watch-card img{width:100%;aspect-ratio:1/1;display:block;object-fit:contain;background:#fff}
.watch-caption{margin:12px 0 0;padding-top:12px;border-top:1px solid rgba(20,32,25,.09);text-align:center;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#4e5a53}
.empty{grid-column:1/-1;padding:70px 20px;text-align:center;color:#777;border:1px solid var(--line);background:#fff}
.site-footer{padding:34px 5vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#656b67;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase}
.error-box{margin:30px auto;padding:20px;width:min(900px,92vw);background:#fff;border:1px solid #b66;color:#6a1d1d}
@media(max-width:900px){
  .site-nav{display:none}
  .brands{grid-template-columns:1fr;max-width:560px}
  .products,.watch-grid{grid-template-columns:repeat(2,1fr)}
  .product[open]{grid-column:1/-1}
  .product-details{grid-template-columns:1fr}
}
@media(max-width:520px){
  .hero{min-height:270px}
  .brands,.collection{width:calc(100% - 28px)}
  .brand-head{min-height:360px;padding:24px 20px}
  .logo-wrap{height:250px}
  .products,.watch-grid{grid-template-columns:1fr}
  .product[open] .product-summary{grid-template-columns:1fr}
  .product[open] .product-info{border-left:0;border-top:1px solid var(--line)}
  .detail-gallery{grid-template-columns:1fr}
  .site-footer{flex-direction:column;text-align:center}
}
</style>
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="#top">MY POLO WORLD</a>
  <nav class="site-nav">
    <a href="#brands">Our Brands</a>
    <a href="#brands">Collections</a>
  </nav>
</header>

<main id="top">
  <section class="hero" id="hero"></section>

  <section class="intro" id="brands">
    <p class="eyebrow">Our Houses</p>
    <h1>Three worlds. One polo spirit.</h1>
    <p>Discover distinct expressions of polo heritage, shaped through sport, style and place.</p>
  </section>

  <section class="brands" id="brandGrid"></section>

  <section class="collection" id="collection" hidden>
    <div class="collection-banner" id="collectionBanner" hidden></div>
    <div class="collection-title">
      <p id="collectionBrand"></p>
      <h2 id="collectionHeading"></h2>
    </div>
    <div id="collectionContent"></div>
  </section>

  <div id="loadError"></div>
</main>

<footer class="site-footer">
  <span>© 2026 My Polo World</span>
  <span>Fashion · Eyewear · Lifestyle</span>
</footer>

a-polo-racquet-club/img/big/SB-1-10646-3.jpg", "https://www.bestwatch.ru/images/Santa%20Barbara%20Polo%20%26%20Racquet%20Club/big/SB.1.10646-3/SB.1.10646-3_1.jpg", "https://www.bestwatch.ru/bigimage/Santa%20Barbara%20Polo%20%26%20Racquet%20Club/SB.1.10646-3.jpg"]}, {"model": "SB.4.10023-1", "images": ["https://static.alltime.ru/obj/catalog/watch/santa-barbara-polo-racquet-club/img/big/SB-4-10023-1.jpg", "https://www.bestwatch.ru/images/Santa%20Barbara%20Polo%20%26%20Racquet%20Club/big/SB.4.10023-1/SB.4.10023-1_1.jpg", "https://www.bestwatch.ru/bigimage/Santa%20Barbara%20Polo%20%26%20Racquet%20Club/SB.4.10023-1.jpg"]}];
let SITE = null;

function esc(s="") {
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function slug(s="") {
  return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
}
function normalizeBarcode(v="") {
  return String(v).trim().toUpperCase().replace(/\s+/g,"");
}
function directProductUrl(barcode) {
  const b=normalizeBarcode(barcode);
  return b ? ("https://mypoloworld.com/?barcode="+encodeURIComponent(b)) : "https://mypoloworld.com/";
}
function brandById(id) {
  return SITE.brands.find(b => b.id === id) || {id, name:id, accent:"#204d38", logo:""};
}

function buildTree(paths) {
  const root = {};
  (paths || []).forEach(path => {
    const parts = String(path).split("/").map(x => x.trim()).filter(Boolean);
    let node = root;
    parts.forEach(part => {
      node[part] ||= {};
      node = node[part];
    });
  });
  return root;
}

function renderTreeNode(node, brandId, prefix=[]) {
  return Object.entries(node).map(([name, children], index) => {
    const path = [...prefix, name];
    const keys = Object.keys(children);
    if (!keys.length) {
      const full = path.join(" / ");
      return `<div class="leaf-list"><button class="leaf" type="button" onclick='openCollection(${JSON.stringify(brandId)}, ${JSON.stringify(full)})'>${esc(name)}</button></div>`;
    }
    const cls = prefix.length ? "subcategory" : "category";
    const titleCls = prefix.length ? "subcategory-title" : "category-title";
    return `<details class="${cls}">
      <summary class="${titleCls}">${esc(name)}</summary>
      ${renderTreeNode(children, brandId, path)}
    </details>`;
  }).join("");
}

function renderBrands() {
  const grid = document.getElementById("brandGrid");
  grid.innerHTML = SITE.brands.map(b => `
    <details class="brand-card" data-brand="${esc(b.id)}" style="--accent:${esc(b.accent || "#204d38")}">
      <summary class="brand-summary">
        <div class="brand-head">
          <div class="logo-wrap">
            ${b.logo ? `<img class="brand-logo" src="${esc(b.logo)}" alt="${esc(b.name)}">` : ""}
          </div>
          <div class="brand-label">
            <strong>${esc(b.name)}</strong>
            <span class="plus">+</span>
          </div>
        </div>
      </summary>
      ${renderTreeNode(buildTree(SITE.categories[b.id] || []), b.id)}
    </details>
  `).join("");
}

function chooseBanner(brandId, categoryPath) {
  const leaf = categoryPath.split("/").map(x=>x.trim()).filter(Boolean).pop() || "";
  const targetId = brandId + "-" + slug(leaf);
  const active = (SITE.banners || []).filter(b => b.active !== false);
  return active.find(b => b.brand === brandId && b.location === categoryPath)
      || active.find(b => b.id === targetId)
      || active.find(b => b.brand === brandId && String(b.title||"").toLowerCase().includes(leaf.toLowerCase()))
      || active.find(b => b.brand === brandId && b.location === "collection")
      || null;
}

function productHTML(p) {
  const imgs = (p.images || []).filter(Boolean);
  const cover = imgs[0] || "";
  const gallery = imgs.slice(1);
  const b = brandById(p.brand);
  const barcode = normalizeBarcode(p.barcode || "");
  const directUrl = barcode ? directProductUrl(barcode) : "";
  return `<details class="product" data-product-id="${esc(p.id || "")}" data-barcode="${esc(barcode)}">
    <summary class="product-summary">
      <div class="product-cover">${cover ? `<img src="${esc(cover)}" alt="${esc(p.name || p.code || "Product")}">` : ""}</div>
      <div class="product-info">
        <div class="product-top">
          <div>
            <p class="product-name">${esc(p.name || "Product")}</p>
            <h3 class="product-code">${esc(p.code || "")}</h3>
          </div>
          <div class="product-price">${esc(p.price || "")}</div>
        </div>
        <span class="view-details"></span>
      </div>
    </summary>
    <div class="product-details">
      <div class="detail-gallery">
        ${gallery.map((src,i)=>`<img src="${esc(src)}" alt="${esc(p.code || p.name)} view ${i+2}">`).join("")}
      </div>
      <div class="detail-copy">
        <h4>Product Details</h4>
        <div class="detail-row"><span>Brand</span><span>${esc(b.name)}</span></div>
        <div class="detail-row"><span>Category</span><span>${esc(p.categoryPath || "")}</span></div>
        ${p.code ? `<div class="detail-row"><span>Model</span><span>${esc(p.code)}</span></div>` : ""}
        ${barcode ? `<div class="detail-row"><span>Barcode</span><span>${esc(barcode)}</span></div>` : ""}
        ${p.price ? `<div class="detail-row"><span>Price</span><span>${esc(p.price)}</span></div>` : ""}
        ${p.description ? `<div class="detail-row"><span>Description</span><span>${esc(p.description)}</span></div>` : ""}
        ${directUrl ? `<div class="detail-row"><span>Product link</span><span><a class="product-link" href="${esc(directUrl)}">Open direct link</a></span></div>` : ""}
      </div>
    </div>
  </details>`;
}

function injectProductStructuredData() {
  document.getElementById("productStructuredData")?.remove();
  const graph=(SITE.products||[]).filter(p=>p.active!==false).map(p=>{
    const b=brandById(p.brand), barcode=normalizeBarcode(p.barcode||"");
    const item={
      "@type":"Product",
      "@id": barcode ? directProductUrl(barcode)+"#product" : "https://mypoloworld.com/#"+(p.id||slug(p.code||p.name||"product")),
      "name":p.name||p.code||"Product",
      "sku":p.code||p.id||"",
      "brand":{"@type":"Brand","name":b.name},
      "category":p.categoryPath||"",
      "url":barcode?directProductUrl(barcode):"https://mypoloworld.com/"
    };
    if(barcode)item.identifier={"@type":"PropertyValue","propertyID":"MPW Barcode","value":barcode};
    if((p.images||[])[0])item.image=(p.images||[]).map(src=>new URL(src,location.href).href);
    if(p.description)item.description=p.description;
    return item;
  });
  const script=document.createElement("script");
  script.id="productStructuredData";script.type="application/ld+json";
  script.textContent=JSON.stringify({"@context":"https://schema.org","@graph":graph});
  document.head.appendChild(script);
}

function applyProductMeta(p) {
  const barcode=normalizeBarcode(p.barcode||"");
  const b=brandById(p.brand);
  const label=[b.name,p.name||"Product",p.code||""].filter(Boolean).join(" — ");
  document.title=label+" | My Polo World";
  let meta=document.querySelector('meta[name="description"]');
  if(meta)meta.content=[label,barcode?"Barcode "+barcode:"",p.price||""].filter(Boolean).join(" · ");
  let canonical=document.querySelector('link[rel="canonical"]');
  if(canonical&&barcode)canonical.href=directProductUrl(barcode);
}

function openRequestedProduct() {
  const params=new URLSearchParams(location.search);
  const requestedBarcode=normalizeBarcode(params.get("barcode")||"");
  const requestedId=String(params.get("product")||"").trim();
  if(!requestedBarcode&&!requestedId)return;
  const p=(SITE.products||[]).find(x=>x.active!==false&&(
    (requestedBarcode&&normalizeBarcode(x.barcode)===requestedBarcode) ||
    (requestedId&&String(x.id||"")===requestedId)
  ));
  if(!p){
    document.getElementById("loadError").innerHTML='<div class="error-box">Product not found for this barcode or link.</div>';
    return;
  }
  applyProductMeta(p);
  openCollection(p.brand,p.categoryPath);
  setTimeout(()=>{
    const target=[...document.querySelectorAll(".product")].find(el=>el.dataset.productId===String(p.id||"") || (requestedBarcode&&normalizeBarcode(el.dataset.barcode)===requestedBarcode));
    if(target){
      document.querySelectorAll(".product").forEach(other=>other.open=false);
      target.open=true;
      target.scrollIntoView({behavior:"smooth",block:"start"});
    }
  },120);
}

function renderWatchFallback() {
  return `<div class="watch-grid">${FALLBACK_WATCHES.map(w => {
    const sources = esc(JSON.stringify(w.images || []));
    const first = (w.images || [])[0] || "";
    return `<article class="watch-card">
      <img src="${esc(first)}" alt="Santa Barbara ${esc(w.model)}" data-sources='${sources}' data-index="0" referrerpolicy="no-referrer" onerror="showNextWatchImage(this)">
      <p class="watch-caption">${esc(w.model)}</p>
    </article>`;
  }).join("")}</div>`;
}

function showNextWatchImage(img) {
  try {
    const sources = JSON.parse(img.dataset.sources || "[]");
    let index = Number(img.dataset.index || 0) + 1;
    if(index < sources.length) {
      img.dataset.index = index;
      img.src = sources[index];
    } else {
      img.onerror = null;
    }
  } catch(e) {
    img.onerror = null;
  }
}

function bindProductOpenClose() {
  document.querySelectorAll(".product-summary").forEach(summary => {
    summary.addEventListener("click", event => {
      event.preventDefault();
      const product = summary.closest(".product");
      const shouldOpen = !product.open;
      document.querySelectorAll(".product").forEach(other => other.open = false);
      product.open = shouldOpen;
      if(shouldOpen) setTimeout(()=>product.scrollIntoView({behavior:"smooth",block:"start"}),50);
    });
  });
}

function openCollection(brandId, categoryPath) {
  const section = document.getElementById("collection");
  const b = brandById(brandId);
  const banner = chooseBanner(brandId, categoryPath);
  const leaf = categoryPath.split("/").map(x=>x.trim()).filter(Boolean).pop() || categoryPath;
  const products = (SITE.products || []).filter(p =>
    p.active !== false && p.brand === brandId && p.categoryPath === categoryPath
  );

  document.getElementById("collectionBrand").textContent = banner?.subtitle || b.name;
  document.getElementById("collectionHeading").textContent = banner?.title || (leaf + " Collection");

  const bannerEl = document.getElementById("collectionBanner");
  if(banner && banner.image) {
    bannerEl.style.backgroundImage = `url("${banner.image}")`;
    bannerEl.hidden = false;
  } else {
    bannerEl.hidden = true;
    bannerEl.style.backgroundImage = "";
  }

  const content = document.getElementById("collectionContent");
  if(products.length) {
    content.innerHTML = `<div class="products">${products.map(productHTML).join("")}</div>`;
    bindProductOpenClose();
  } else if(brandId === "santa" && categoryPath === "Accessories / Watches") {
    content.innerHTML = renderWatchFallback();
  } else {
    content.innerHTML = `<div class="empty">Collection coming soon.</div>`;
  }

  section.hidden = false;
  setTimeout(()=>section.scrollIntoView({behavior:"smooth",block:"start"}),50);
}

async function loadSite() {
  try {
    const r = await fetch("site-data.json?v=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("site-data.json could not be loaded (" + r.status + ")");
    SITE = await r.json();

    document.title = SITE.site?.title || "My Polo World";
    document.querySelector(".wordmark").textContent = (SITE.site?.title || "My Polo World").toUpperCase();

    const homeBanner = (SITE.banners || []).find(b => b.active !== false && (b.id === "home-hero" || b.location === "home-hero"));
    const heroImage = homeBanner?.image || SITE.site?.heroImage || "assets/fall-winter-banner.png";
    document.getElementById("hero").style.backgroundImage = `url("${heroImage}")`;

    renderBrands();
    injectProductStructuredData();
    openRequestedProduct();
  } catch(e) {
    document.getElementById("loadError").innerHTML = `<div class="error-box">Website data could not be loaded. ${esc(e.message)}</div>`;
  }
}
loadSite();
</script>
