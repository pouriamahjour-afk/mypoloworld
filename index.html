<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="My Polo World — a curated world of polo lifestyle brands.">
<title>My Polo World</title>
<style>
:root{--ink:#142019;--paper:#fbfaf6;--line:rgba(20,32,25,.14);--green:#204d38;--navy:#071b33;--burgundy:#6f1727}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:var(--paper);font-family:"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,a{-webkit-tap-highlight-color:transparent}
.site-header{min-height:76px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);background:rgba(251,250,246,.96);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
.wordmark{color:inherit;text-decoration:none;font-family:Georgia,"Times New Roman",serif;font-size:1.2rem;letter-spacing:.22em;white-space:nowrap}.site-nav{display:flex;gap:28px}.site-nav a{color:inherit;text-decoration:none;text-transform:uppercase;font-size:.78rem;letter-spacing:.16em}
.hero-placeholder{width:100%;min-height:clamp(300px,43.5vw,760px);background:#172126 url("assets/fall-winter-banner.png") center center/cover no-repeat;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.intro{max-width:760px;margin:0 auto;padding:74px 24px 46px;text-align:center}.eyebrow{margin:0 0 18px;font-size:.76rem;letter-spacing:.25em;text-transform:uppercase;color:#6b706d}h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,4vw,3.4rem);font-weight:400;letter-spacing:.06em}.intro p:last-child{max-width:560px;margin:20px auto 0;color:#59605c;font-family:Georgia,"Times New Roman",serif;font-size:1.05rem;line-height:1.75}
.brands{width:min(1240px,92vw);margin:0 auto;padding:0 0 92px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.brand-card{min-width:0;border:1px solid var(--line);background:#fff;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease}.brand-card:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(20,32,25,.1)}
.brand-button{width:100%;min-height:460px;padding:34px 26px 28px;border:0;color:inherit;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font:inherit}.brand-card[data-brand=santa] .brand-button{background:#f3efe5}.brand-card[data-brand=sanmarco] .brand-button{background:#f7f4ec}.brand-card[data-brand=venezia] .brand-button{background:#f4eee8}
.logo-wrap{width:100%;height:325px;display:grid;place-items:center}.brand-logo{display:block;max-width:91%;max-height:305px;object-fit:contain;mix-blend-mode:multiply}.brand-card[data-brand=santa] .brand-logo{max-width:82%}.brand-label{width:100%;padding-top:24px;border-top:1px solid rgba(20,32,25,.12);display:flex;justify-content:space-between;align-items:center;gap:16px}.brand-label strong{font-family:Georgia,"Times New Roman",serif;font-size:1rem;font-weight:400;letter-spacing:.06em;text-align:left}.plus{font-size:1.5rem;font-weight:300;transition:transform .2s ease}.brand-card.open .plus{transform:rotate(45deg)}
.brand-card[data-brand=santa]{border-bottom:4px solid var(--green)}.brand-card[data-brand=sanmarco]{border-bottom:4px solid var(--navy)}.brand-card[data-brand=venezia]{border-bottom:4px solid var(--burgundy)}.brand-menu{max-height:0;overflow:hidden;background:#fff;transition:max-height .4s ease}.brand-card.open .brand-menu{max-height:2600px}.menu-toggle{width:100%;min-height:64px;padding:0 26px;border:0;border-top:1px solid var(--line);background:#fff;color:inherit;display:flex;align-items:center;justify-content:space-between;cursor:pointer;text-transform:uppercase;letter-spacing:.16em;font-size:.82rem}.menu-toggle:after{content:"+";font-size:1.25rem;font-weight:300}.menu-section.open>.menu-toggle:after{content:"−"}.submenu{max-height:0;overflow:hidden;background:#f7f6f2;transition:max-height .3s ease}.menu-section.open>.submenu{max-height:1600px}.people-toggle{background:#f7f6f2;padding-left:38px}.leaf-grid{padding:12px 26px 22px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:#e5e2da}.leaf{min-height:48px;padding:0 16px;background:#fff;display:flex;align-items:center;font-family:Georgia,"Times New Roman",serif;font-size:.92rem}.nested .leaf-grid{padding-left:38px;background:#efede7}.brand-card[data-brand=santa] .menu-toggle:hover{color:var(--green)}.brand-card[data-brand=sanmarco] .menu-toggle:hover{color:var(--navy)}.brand-card[data-brand=venezia] .menu-toggle:hover{color:var(--burgundy)}
.leaf.action{width:100%;border:0;color:inherit;cursor:pointer;text-align:left}.catalog{display:none;width:min(1180px,92vw);margin:0 auto;padding:42px 0 90px}.catalog.active{display:block}.catalog.santa-theme{width:100%;max-width:none;margin:0;padding:0 0 90px;background:#f3efe5;color:#173d2b}.catalog-inner{width:min(1380px,94vw);margin:0 auto;padding-top:38px}.collection-hero{width:100%;aspect-ratio:2/1;max-height:650px;object-fit:cover;object-position:center;display:block;border-bottom:5px solid var(--green)}.catalog-back{border:0;background:none;padding:0 0 28px;cursor:pointer;color:inherit;font-size:.82rem;letter-spacing:.15em;text-transform:uppercase}.catalog-head{border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:36px}.catalog-head p{margin:0 0 10px;color:#647067;text-transform:uppercase;letter-spacing:.2em;font-size:.76rem}.catalog-head h2{margin:0;font:400 clamp(2rem,4vw,3.3rem) Georgia,serif}.product-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;background:#f3efe5}.product-card{border:3px solid var(--green);background:#fff;padding:0;cursor:pointer;text-align:left;color:inherit;overflow:hidden}.product-card img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#fff}.product-copy{padding:16px}.product-copy strong{display:block;font:400 1.15rem Georgia,serif}.product-copy span{display:block;margin-top:8px;color:#626864}.product-detail{display:grid;grid-template-columns:1.2fr .8fr;gap:48px}.main-product-image{width:100%;aspect-ratio:1;object-fit:cover;background:#fff;border:3px solid var(--green)}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.thumbs button{border:2px solid var(--green);background:#fff;padding:0;cursor:pointer}.thumbs img{width:100%;display:block;background:#fff}.product-info h2{font:400 clamp(2rem,4vw,3.3rem) Georgia,serif;margin:0 0 12px}.product-price{font-size:1.25rem;margin-bottom:32px}.specs{width:100%;border-collapse:collapse}.specs td{padding:14px 0;border-bottom:1px solid var(--line)}.specs td:last-child{text-align:right;font-weight:600}.empty{padding:70px 0;text-align:center;color:#737975}
.site-footer{padding:34px 5vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;color:#656b67;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:900px){.site-header{min-height:68px}.site-nav{display:none}.brands{grid-template-columns:1fr;max-width:560px}.brand-button{min-height:410px}.logo-wrap{height:290px}.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.product-detail{grid-template-columns:1fr}}
@media(max-width:520px){.wordmark{font-size:1rem;letter-spacing:.17em}.hero-placeholder{min-height:270px}.intro{padding:54px 22px 34px}.intro p:last-child{font-size:1rem}.brands{width:calc(100% - 28px);gap:16px;padding-bottom:58px}.brand-button{min-height:360px;padding:24px 20px}.logo-wrap{height:250px}.brand-logo{max-height:235px}.collection-hero{aspect-ratio:1.25/1;object-position:center}.product-grid{grid-template-columns:1fr}.site-footer{flex-direction:column;text-align:center}}
</style>
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="#top">MY POLO WORLD</a>
  <nav class="site-nav" aria-label="Main navigation"><a href="#brands">Our Brands</a><a href="#brands">Collections</a></nav>
</header>
<main id="top">
  <section class="hero-placeholder" aria-label="Campaign banner"></section>
  <section class="intro" id="brands">
    <p class="eyebrow">Our Houses</p>
    <h1>Three worlds. One polo spirit.</h1>
    <p>Discover distinct expressions of polo heritage, shaped through sport, style and place.</p>
  </section>
  <section class="brands" aria-label="Polo brands">
    <article class="brand-card" data-brand="santa">
      <button class="brand-button" type="button" aria-expanded="false"><span class="logo-wrap"><img class="brand-logo" src="assets/santa-barbara.jpeg" alt="Santa Barbara Polo and Racquet Club"></span><span class="brand-label"><strong>Santa Barbara Polo &amp; Racquet Club</strong><span class="plus" aria-hidden="true">+</span></span></button>
      <div class="brand-menu"></div>
    </article>
    <article class="brand-card" data-brand="sanmarco">
      <button class="brand-button" type="button" aria-expanded="false"><span class="logo-wrap"><img class="brand-logo" src="assets/polo-san-marco.png" alt="Polo San Marco"></span><span class="brand-label"><strong>Polo San Marco</strong><span class="plus" aria-hidden="true">+</span></span></button>
      <div class="brand-menu"></div>
    </article>
    <article class="brand-card" data-brand="venezia">
      <button class="brand-button" type="button" aria-expanded="false"><span class="logo-wrap"><img class="brand-logo" src="assets/venezia-polo.png" alt="Venezia Polo"></span><span class="brand-label"><strong>Venezia Polo</strong><span class="plus" aria-hidden="true">+</span></span></button>
      <div class="brand-menu"></div>
    </article>
  </section>
  <section class="catalog" id="catalog" aria-live="polite"></section>
</main>
<footer class="site-footer"><span>© 2026 My Polo World</span><span>Fashion · Eyewear · Lifestyle</span></footer>
<script>
const categories={
  Apparels:{
    Men:['Underwear','Shirts','T-Shirts','Polo Shirts','Pants','Sweater','Blouse','Hoodie'],
    Women:['Blouse','Skirts','Shorts','Underwear','Pants','Sweater','Hoodie'],
    Kids:['Down','Up']
  },
  Accessories:{Eyewear:['Optical Frames','Sunglasses'],Other:['Belt','Hat','Bracelet','Bag','Necklace','Watches']},
  Home:['Bed','Living Room','Kitchen','Decoration']
};

const leaves=(items,brand)=>`<div class="leaf-grid">${items.map(item=>item==='Sunglasses'||item==='Optical Frames'?`<button class="leaf action" type="button" data-brand="${brand}" data-collection="${item}">${item}</button>`:`<span class="leaf">${item}</span>`).join('')}</div>`;
const menuMarkup=brand=>Object.entries(categories).map(([name,content])=>{
  const inside=Array.isArray(content)
    ? leaves(content,brand)
    : Object.entries(content).map(([group,items])=>`<div class="menu-section nested"><button class="menu-toggle people-toggle" type="button" aria-expanded="false">${group}</button><div class="submenu">${leaves(items,brand)}</div></div>`).join('');
  return `<div class="menu-section"><button class="menu-toggle" type="button" aria-expanded="false">${name}</button><div class="submenu">${inside}</div></div>`;
}).join('');

document.querySelectorAll('.brand-card').forEach(card=>card.querySelector('.brand-menu').innerHTML=menuMarkup(card.dataset.brand));
document.querySelectorAll('.brand-button').forEach(button=>button.addEventListener('click',()=>{const card=button.closest('.brand-card');const isOpen=card.classList.toggle('open');button.setAttribute('aria-expanded',String(isOpen))}));
document.querySelectorAll('.menu-toggle').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();const section=button.closest('.menu-section');const isOpen=section.classList.toggle('open');button.setAttribute('aria-expanded',String(isOpen))}));
const products=[
 {model:'SB 1137',price:'$69.40',type:"Women's Sunglasses",images:['assets/sb-1137-front.png','assets/sb-1137-three-quarter.png','assets/sb-1137-side.png','assets/sb-1137-model.png'],specs:[['Color','03'],['Lens width','50 mm'],['Bridge width','18 mm'],['Temple length','145 mm']]},
 {model:'SB 1154',price:'$53.50',type:"Men's Sunglasses",images:['assets/sb-1154-front.png','assets/sb-1154-three-quarter.png','assets/sb-1154-side.png','assets/sb-1154-model.png'],specs:[['Color','03'],['Lens width','56 mm'],['Bridge width','18 mm'],['Temple length','145 mm']]},
 {model:'SB 1170',price:'$96.00',type:"Women's Sunglasses",images:['assets/sb-1170-front.png','assets/sb-1170-three-quarter.png','assets/sb-1170-side.png','assets/sb-1170-model.png'],specs:[['Color','02'],['Lens width','54 mm'],['Bridge width','18 mm'],['Temple length','145 mm']]},
 {model:'SB 1132',price:'$100.70',type:"Men's Sunglasses",images:['assets/sb-1132-front.png','assets/sb-1132-three-quarter.png','assets/sb-1132-side.png','assets/sb-1132-model.png'],specs:[['Color','01'],['Lens width','54 mm'],['Bridge width','17 mm'],['Temple length','145 mm']]}
];
const homeSections=[document.querySelector('.hero-placeholder'),document.querySelector('.intro'),document.querySelector('.brands')];
const catalog=document.getElementById('catalog');
function showHome(){catalog.className='catalog';homeSections.forEach(el=>el.style.display='');scrollTo(0,document.getElementById('brands').offsetTop-70)}
function showCollection(brand,name){homeSections.forEach(el=>el.style.display='none');const isSanta=brand==='santa';catalog.className=`catalog active${isSanta?' santa-theme':''}`;const hasProduct=isSanta&&name==='Sunglasses';const banner=isSanta?'<img class="collection-hero" src="assets/santa-barbara-eyewear-banner.png" alt="Santa Barbara Polo and Racquet Club winter eyewear collection">':'';const cards=products.map((product,i)=>`<button class="product-card" onclick="showProduct(${i})"><img src="${product.images[0]}" alt="${product.model} ${product.type}"><span class="product-copy"><strong>${product.model}</strong><span>${product.type} · ${product.price}</span></span></button>`).join('');catalog.innerHTML=`${banner}<div class="catalog-inner"><button class="catalog-back" onclick="showHome()">← Back to brands</button><div class="catalog-head"><p>${isSanta?'Santa Barbara Polo & Racquet Club':brand==='sanmarco'?'Polo San Marco':'Venezia Polo'} · Eyewear</p><h2>${name}</h2></div>${hasProduct?`<div class="product-grid">${cards}</div>`:`<div class="empty">Products coming soon.</div>`}</div>`;scrollTo(0,0)}
function showProduct(index){const product=products[index];catalog.className='catalog active santa-theme';catalog.innerHTML=`<img class="collection-hero" src="assets/santa-barbara-eyewear-banner.png" alt="Santa Barbara Polo and Racquet Club winter eyewear collection"><div class="catalog-inner"><button class="catalog-back" onclick="showCollection('santa','Sunglasses')">← Back to sunglasses</button><div class="product-detail"><div><img class="main-product-image" id="mainProductImage" src="${product.images[0]}" alt="${product.model} ${product.type}"><div class="thumbs">${product.images.map((image,i)=>`<button type="button" onclick="document.getElementById('mainProductImage').src='${image}'"><img src="${image}" alt="${product.model} view ${i+1}"></button>`).join('')}</div></div><div class="product-info"><p class="eyebrow">Santa Barbara Polo & Racquet Club · ${product.type}</p><h2>${product.model}</h2><div class="product-price">${product.price}</div><table class="specs">${product.specs.map(row=>`<tr><td>${row[0]}</td><td>${row[1]}</td></tr>`).join('')}</table></div></div></div>`;scrollTo(0,0)}
document.querySelectorAll('.leaf.action').forEach(button=>button.addEventListener('click',event=>{event.stopPropagation();showCollection(button.dataset.brand,button.dataset.collection)}));
</script>
</body>
</html>
