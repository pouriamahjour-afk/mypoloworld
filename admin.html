<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My Polo World — Admin</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#f7f4ec;font-family:Arial,sans-serif}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#204d38;font-size:16px}
#adminFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f4ec;visibility:hidden}
#error{display:none;position:fixed;inset:0;padding:40px;color:#8b1f1f;background:#fff;font:16px/1.6 Arial,sans-serif}
</style>
</head>
<body>
<div id="loading">Loading admin panel…</div>
<div id="error"></div>
<iframe id="adminFrame" title="My Polo World Admin"></iframe>

<script>
const SOURCE='https://raw.githubusercontent.com/pouriamahjour-afk/mypoloworld/b20b56bc707cad6e1e953cb29f8c5cacc50a2ae1/admin.html';

const frame=document.getElementById('adminFrame');
const loading=document.getElementById('loading');
const errorBox=document.getElementById('error');

function patchAdmin(){
  try{
    const doc=frame.contentDocument;
    if(!doc || !doc.body) return;

    const patch=doc.createElement('script');
    patch.textContent=`
(function(){
  const originalOpenProduct=openProduct;

  openProduct=function(i=-1){
    originalOpenProduct(i);

    const field=$("pBarcode");
    if(!field)return;

    if(i<0){
      field.value="";
      updateProductLink();
    }

    field.placeholder="Optional — enter real barcode when available";

    const box=field.closest(".c6");
    if(box){
      const label=box.querySelector("label");
      if(label)label.textContent="Barcode (optional)";

      const help=box.querySelector(".help");
      if(help)help.textContent="Optional. Leave blank until you have the real barcode.";

      const generateButton=box.querySelector("button");
      if(generateButton)generateButton.style.display="none";
    }
  };

  saveProduct=async function(i){
    try{
      const barcode=normalizeBarcode($("pBarcode").value);

      if(barcode){
        const duplicate=data.products.findIndex((p,idx)=>idx!==i&&normalizeBarcode(p.barcode)===barcode);
        if(duplicate>=0){
          return setStatus("This barcode is already used by product "+(data.products[duplicate].code||data.products[duplicate].name)+".","err");
        }
      }

      const uploaded=$("pUpload").files.length?await uploadFiles($("pUpload")):[];
      const currentImages=$("pImages").value.split(/\\n+/).map(x=>x.trim()).filter(Boolean);

      const existing=i>=0?data.products[i]:{};

      const obj={
        ...existing,
        id:i>=0?existing.id:slug($("pBrand").value+"-"+($("pCode").value||$("pName").value)),
        brand:$("pBrand").value,
        categoryPath:$("pCategory").value,
        name:$("pName").value.trim(),
        code:$("pCode").value.trim(),
        barcode,
        price:$("pPrice").value.trim(),
        description:$("pDesc").value.trim(),
        images:[...currentImages,...uploaded],
        active:$("pActive").value==="true"
      };

      if(i>=0)data.products[i]=obj;
      else data.products.push(obj);

      markDirty();
      renderAll();
      closeEditor();
      setStatus("Product changed in draft. Click Save all changes to publish.","ok");
    }catch(e){
      setStatus("Image upload/product save failed: "+e.message,"err");
    }
  };

  const bulk=[...document.querySelectorAll("button")]
    .find(b=>b.textContent.trim()==="Generate missing barcodes");
  if(bulk)bulk.style.display="none";

  setStatus("Panel ready. Barcode is optional; prices can be saved without one.","ok");
})();
`;

    doc.body.appendChild(patch);

    frame.style.visibility='visible';
    loading.style.display='none';
  }catch(e){
    errorBox.style.display='block';
    errorBox.textContent='Admin patch failed: '+e.message;
    loading.style.display='none';
  }
}

frame.addEventListener('load',patchAdmin);

fetch(SOURCE,{cache:'no-store'})
  .then(r=>{
    if(!r.ok)throw new Error('Could not load admin source ('+r.status+')');
    return r.text();
  })
  .then(html=>{
    html=html.replace('<head>','<head><base href="https://mypoloworld.com/">');
    frame.srcdoc=html;
  })
  .catch(e=>{
    loading.style.display='none';
    errorBox.style.display='block';
    errorBox.textContent='Could not load admin panel: '+e.message;
  });
</script>
</body>
</html>
